<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
  </head>
  <body>
    <!--
      Build-time form definitions for Netlify Forms (required by the Next.js
      runtime v5 — forms in server-rendered pages aren't detected). The live
      form in src/components/ContactForm.tsx POSTs url-encoded data to this
      file's path. Field names here MUST stay in sync with that component.
    -->
    <!-- /contact (and the coming-soon page): the lean contact form. The
         practice + interest fields moved to the start-project form below
         when /start-a-project split off (2026-07-31). -->
    <form name="project-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-enquiry" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="marketing-opt-in" />
    </form>

    <!-- /start-a-project: the project form, in the overlay and on the
         fallback page (src/components/StartProjectForm.tsx). `needs` is a
         SINGLE value since 2026-08-01 (the choice chips became radio cards —
         one service per enquiry, or "Not sure yet"). -->
    <!-- marketing-opt-in REMOVED 2026-08-01 (client: the consent line
         "kinda looks awful too - remove it") — the form posts no marketing
         consent, so none is recorded and no marketing email may be sent to
         these addresses (Spam Act/PECR). If marketing ever returns to this
         form, the checkbox and the consent record come back TOGETHER. -->
    <form name="start-project" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="start-project" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="practice" />
      <input type="text" name="needs" />
      <textarea name="message"></textarea>
    </form>

    <!-- Homepage mailing-list capture (the freebie band) — lives in
         src/components/NewsletterSignup.tsx -->
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input name="bot-field" />
      <input type="email" name="email" />
      <input type="checkbox" name="marketing-opt-in" />
    </form>
  </body>
</html>
